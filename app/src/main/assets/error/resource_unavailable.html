<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>暂时无法连接</title>
  <style>
    :root { color-scheme: light; --primary:#2563eb; --ink:#172033; --muted:#667085; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:28px 22px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--ink); background:#f3f6fb; }
    main { width:min(100%,460px); padding:38px 30px 30px; border:1px solid #e4eaf2; border-radius:8px;
      background:#fff; box-shadow:0 20px 54px rgba(16,24,40,.10); text-align:center; }
    .icon { width:92px; height:92px; margin:0 auto 24px; display:grid; place-items:center; border-radius:8px;
      background:#eaf2ff; box-shadow:inset 0 0 0 1px #fff,0 10px 24px rgba(37,99,235,.12); }
    svg { width:52px; height:52px; }
    h1 { margin:0 0 12px; font-size:26px; line-height:1.3; letter-spacing:-.3px; }
    p { margin:0 auto 30px; max-width:330px; color:var(--muted); font-size:15px; line-height:1.75; }
    .actions { display:grid; gap:12px; }
    a { min-height:52px; display:flex; align-items:center; justify-content:center; border-radius:8px; text-decoration:none;
      font-size:16px; font-weight:650; -webkit-tap-highlight-color:transparent; transition:transform .12s,opacity .12s; }
    a:active { transform:scale(.98); opacity:.88; }
    .retry { color:#fff; background:#2563eb; box-shadow:0 10px 22px rgba(37,99,235,.22); }
    .offline { color:#1d4ed8; background:#eff6ff; border:1px solid #dbeafe; }
    .hint { margin-top:22px; color:#98a2b3; font-size:12px; }
    @media (max-height:560px) { main{padding:24px}.icon{width:72px;height:72px;margin-bottom:16px}p{margin-bottom:20px} }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><path d="M13 28c4-9 13-15 23-15 12 0 22 8 25 19" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><path d="M10 42h44" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/><path d="M21 51h22" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><circle cx="12" cy="28" r="5" fill="#2563eb"/><path d="m47 16 8 8m0-8-8 8" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <h1>暂时无法连接</h1>
    <p>服务器当前不可达，或首页所需资源未能完整获取。请检查网络后重试，也可以继续使用离线填报。</p>
    <div class="actions">
      <a class="retry" href="hac-error://retry">重新尝试加载</a>
      <a class="offline" href="hac-error://offline-form">前往离线填报</a>
    </div>
    <div class="hint">离线填报数据将安全保存在本机</div>
  </main>
</body>
</html>
